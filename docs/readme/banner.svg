<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Jewlerify: every jewel, verified. Find gold jewellery near you.">
  <defs>
    <radialGradient id="glow" cx="30%" cy="45%" r="60%">
      <stop offset="0" stop-color="#D4AE6A" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#D4AE6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DDA6"/>
      <stop offset=".5" stop-color="#D4AE6A"/>
      <stop offset="1" stop-color="#9C7637"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF0D2"/>
      <stop offset="1" stop-color="#E6C88F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3F1EA"/>
      <stop offset=".42" stop-color="#F3F1EA"/>
      <stop offset=".5" stop-color="#F3DDA6"/>
      <stop offset=".58" stop-color="#F3F1EA"/>
      <stop offset="1" stop-color="#F3F1EA"/>
    </linearGradient>
    <clipPath id="barClip"><path d="M8 148h176l-32-76H40Z M40 72l19-48h74l19 48Z"/></clipPath>
    <clipPath id="typeClip"><rect class="type" x="300" y="226" width="560" height="44"/></clipPath>
    <clipPath id="screen"><rect x="934" y="92" width="168" height="236" rx="14"/></clipPath>
    <style>
      .bob { animation: bob 4s ease-in-out infinite; transform-origin: 96px 90px; }
      .sweep { animation: sweep 3.2s ease-in-out infinite; }
      .word { animation: shimmer 5s linear infinite; }
      .type { transform-box: fill-box; transform-origin: left; animation: type 2.4s steps(32) .6s both; }
      .caret { animation: caret 1s steps(1) infinite, slide 2.4s steps(32) .6s both; }
      .spark { animation: rise 6s linear infinite; opacity: 0; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      .badge { transform-box: fill-box; transform-origin: center; animation: pop 2.6s ease-in-out infinite; }
      .ticker { animation: tick 22s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
      @keyframes bob { 50% { transform: translateY(-10px) rotate(-2deg); } }
      @keyframes sweep { 0% { transform: translateX(-220px); } 60%, 100% { transform: translateX(260px); } }
      @keyframes shimmer { from { transform: translateX(-640px); } to { transform: translateX(640px); } }
      @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(560px); } }
      @keyframes caret { 50% { opacity: 0; } }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-260px); opacity: 0; } }
      @keyframes scan { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(150px); } }
      @keyframes pop { 0%, 55% { transform: scale(0); opacity: 0; } 65% { transform: scale(1.12); opacity: 1; } 75%, 95% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
      @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      @keyframes pulse { 0%, 55% { transform: scale(1); opacity: 0; } 62% { opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .spark { opacity: .5; } .badge { opacity: 1; } }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="440" fill="#1F2427"/>
  <rect width="1200" height="440" fill="url(#glow)"/>
  <g stroke="#fff" stroke-opacity=".035">
    <path d="M0 110H1200M0 220H1200M0 330H1200M300 0V440M600 0V440M900 0V440"/>
  </g>

  <!-- rising gold sparks -->
  <g fill="#E2C38A">
    <circle class="spark" cx="120" cy="400" r="2.5" style="animation-delay:0s"/>
    <circle class="spark" cx="190" cy="420" r="1.8" style="animation-delay:1.1s"/>
    <circle class="spark" cx="260" cy="410" r="3" style="animation-delay:2.4s"/>
    <circle class="spark" cx="340" cy="430" r="2" style="animation-delay:3.3s"/>
    <circle class="spark" cx="460" cy="405" r="2.6" style="animation-delay:.7s"/>
    <circle class="spark" cx="560" cy="425" r="1.6" style="animation-delay:4.1s"/>
    <circle class="spark" cx="650" cy="410" r="2.2" style="animation-delay:1.8s"/>
    <circle class="spark" cx="760" cy="430" r="2.8" style="animation-delay:5s"/>
    <circle class="spark" cx="850" cy="415" r="1.9" style="animation-delay:2.9s"/>
    <circle class="spark" cx="70" cy="425" r="2" style="animation-delay:4.6s"/>
    <circle class="spark" cx="410" cy="435" r="1.5" style="animation-delay:5.5s"/>
    <circle class="spark" cx="710" cy="420" r="2.4" style="animation-delay:3.8s"/>
  </g>

  <!-- the gold bar -->
  <g transform="translate(76 104)">
    <g class="bob">
      <ellipse cx="96" cy="166" rx="86" ry="10" fill="#000" opacity=".35"/>
      <path d="M40 72l19-48h74l19 48Z" fill="url(#barTop)"/>
      <path d="M8 148h176l-32-76H40Z" fill="url(#barFront)"/>
      <path d="M42 72h108" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
      <text x="96" y="122" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#7A5A24" fill-opacity=".55" letter-spacing="3">999.9</text>
      <g clip-path="url(#barClip)">
        <rect class="sweep" x="-40" y="0" width="70" height="170" fill="url(#shine)" transform="skewX(-20)"/>
      </g>
    </g>
  </g>

  <!-- wordmark with a moving gold shimmer -->
  <mask id="wordMask">
    <text x="300" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#fff" letter-spacing="1">Jewlerify</text>
  </mask>
  <rect x="300" y="100" width="560" height="120" fill="#F3F1EA" mask="url(#wordMask)"/>
  <g mask="url(#wordMask)">
    <rect class="word" x="300" y="100" width="560" height="120" fill="url(#goldText)"/>
  </g>

  <!-- typed tagline -->
  <g clip-path="url(#typeClip)">
    <text x="302" y="258" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#E2C38A">Every jewel, verified. Near you.</text>
  </g>
  <rect class="caret" x="302" y="234" width="3" height="30" fill="#E2C38A"/>
  <text x="302" y="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#F3F1EA" fill-opacity=".62">Scan a tag · see purity, weight &amp; a live gold-rate price · find the store</text>

  <!-- phone scanning a QR tag -->
  <g>
    <rect x="924" y="76" width="188" height="268" rx="24" fill="#15191B" stroke="#E2C38A" stroke-opacity=".5" stroke-width="2"/>
    <rect x="990" y="84" width="56" height="6" rx="3" fill="#2a3134"/>
    <g clip-path="url(#screen)">
      <rect x="934" y="92" width="168" height="236" fill="#22292C"/>
      <g transform="translate(963 132)" fill="#F3F1EA">
        <rect width="110" height="110" rx="8" fill="#F3F1EA"/>
        <g fill="#1F2427">
          <rect x="8" y="8" width="28" height="28" rx="3"/><rect x="74" y="8" width="28" height="28" rx="3"/><rect x="8" y="74" width="28" height="28" rx="3"/>
          <rect x="14" y="14" width="16" height="16" fill="#F3F1EA" rx="2"/><rect x="80" y="14" width="16" height="16" fill="#F3F1EA" rx="2"/><rect x="14" y="80" width="16" height="16" fill="#F3F1EA" rx="2"/>
          <rect x="19" y="19" width="6" height="6"/><rect x="85" y="19" width="6" height="6"/><rect x="19" y="85" width="6" height="6"/>
          <rect x="44" y="10" width="8" height="8"/><rect x="56" y="18" width="8" height="8"/><rect x="44" y="30" width="8" height="8"/>
          <rect x="44" y="46" width="8" height="8"/><rect x="60" y="44" width="8" height="8"/><rect x="74" y="46" width="8" height="8"/>
          <rect x="90" y="50" width="8" height="8"/><rect x="10" y="46" width="8" height="8"/><rect x="24" y="54" width="8" height="8"/>
          <rect x="48" y="62" width="8" height="8"/><rect x="66" y="66" width="8" height="8"/><rect x="82" y="70" width="8" height="8"/>
          <rect x="46" y="80" width="8" height="8"/><rect x="60" y="88" width="8" height="8"/><rect x="76" y="92" width="8" height="8"/>
          <rect x="92" y="84" width="8" height="8"/><rect x="50" y="96" width="8" height="8"/>
        </g>
      </g>
      <g class="scan">
        <rect x="934" y="128" width="168" height="3" fill="#E2C38A"/>
        <rect x="934" y="104" width="168" height="24" fill="#E2C38A" opacity=".12"/>
      </g>
      <circle class="pulse" cx="1018" cy="290" r="22" fill="none" stroke="#4CAF7A" stroke-width="3"/>
      <g class="badge">
        <rect x="954" y="272" width="128" height="36" rx="18" fill="#2F7A55"/>
        <path d="M972 290l6 6 11-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="996" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing=".5">VERIFIED</text>
      </g>
    </g>
  </g>

  <!-- ticker -->
  <rect y="386" width="1200" height="54" fill="#15191B"/>
  <rect y="386" width="1200" height="1" fill="#E2C38A" fill-opacity=".35"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#E2C38A">
    <g class="ticker">
      <text x="0" y="419" textLength="1200" lengthAdjust="spacing" style="white-space:pre">  LIVE GOLD RATE  •  24K  22K  18K  14K PER GRAM  •  DECLARED · HALLMARK LINKED · LAB VERIFIED  •  NEAR ME  •  PHOTO FEED  •  QR VERIFY  •  </text>
      <text x="1200" y="419" textLength="1200" lengthAdjust="spacing" style="white-space:pre">  LIVE GOLD RATE  •  24K  22K  18K  14K PER GRAM  •  DECLARED · HALLMARK LINKED · LAB VERIFIED  •  NEAR ME  •  PHOTO FEED  •  QR VERIFY  •  </text>
    </g>
  </g>
</svg>
